<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩虹六号 · 随机干员选择器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景动态粒子 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 165, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 165, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            animation: glowFloat 8s ease-in-out infinite;
        }

        .bg-glow-1 {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.15), transparent);
            animation-delay: 0s;
        }

        .bg-glow-2 {
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.1), transparent);
            animation-delay: 4s;
        }

        @keyframes glowFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 520px;
            max-width: 95vw;
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.9), rgba(10, 10, 18, 0.95));
            border: 1px solid rgba(255, 165, 0, 0.2);
            border-radius: 24px;
            padding: 40px 36px 50px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 40px rgba(255, 165, 0, 0.05),
                inset 0 1px 0 rgba(255, 165, 0, 0.1);
            transition: box-shadow 0.4s ease;
        }

        .container:hover {
            box-shadow:
                0 0 60px rgba(255, 165, 0, 0.08),
                inset 0 1px 0 rgba(255, 165, 0, 0.15);
        }

        /* 标题 */
        .header {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
        }

        .header-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,165,0,0.3)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(255,165,0,0.6)); }
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff8c00, #ffa500, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 6px;
            margin-top: 6px;
            font-weight: 400;
        }

        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffa500, transparent);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        /* 阵营选择 */
        .side-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .side-btn {
            flex: 1;
            padding: 14px 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .side-btn .btn-icon {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }

        .side-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .side-btn.attacker::before {
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.15), rgba(0, 100, 255, 0.05));
        }

        .side-btn.defender::before {
            background: linear-gradient(135deg, rgba(255, 80, 0, 0.15), rgba(200, 0, 0, 0.05));
        }

        .side-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .side-btn.active {
            transform: translateY(0);
            color: #fff;
        }

        .side-btn.attacker.active {
            border-color: #0099ff;
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.2), rgba(0, 100, 255, 0.08));
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.15);
        }

        .side-btn.defender.active {
            border-color: #ff4500;
            background: linear-gradient(135deg, rgba(255, 80, 0, 0.2), rgba(200, 0, 0, 0.08));
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.15);
        }

        .side-btn.active::before {
            opacity: 1;
        }

        .side-btn:active {
            transform: scale(0.97);
        }

        /* 显示区域 */
        .display-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            overflow: hidden;
        }

        .display-area.attacker-active {
            border-color: rgba(0, 150, 255, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 150, 255, 0.05);
        }

        .display-area.defender-active {
            border-color: rgba(255, 69, 0, 0.2);
            box-shadow: inset 0 0 30px rgba(255, 69, 0, 0.05);
        }

        .display-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            transition: color 0.4s ease;
        }

        .display-area.attacker-active .display-label {
            color: rgba(0, 150, 255, 0.5);
        }

        .display-area.defender-active .display-label {
            color: rgba(255, 69, 0, 0.5);
        }

        .operator-result {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            min-height: 48px;
            line-height: 1.3;
            transition: color 0.4s ease;
            position: relative;
        }

        .display-area.attacker-active .operator-result {
            color: #66bfff;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }

        .display-area.defender-active .operator-result {
            color: #ff6a33;
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
        }

        .operator-result.spinning {
            animation: textSpin 0.08s steps(1) infinite;
        }

        @keyframes textSpin {
            0% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-3px); opacity: 0.7; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .operator-result.reveal {
            animation: revealIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes revealIn {
            0% {
                transform: scale(0.5) rotateX(40deg);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: scale(1) rotateX(0deg);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 干员数量指示 */
        .operator-count {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* 抽选按钮 */
        .pick-btn {
            display: block;
            width: 100%;
            padding: 18px 0;
            border: none;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #333, #222);
            opacity: 0.5;
            pointer-events: none;
        }

        .pick-btn.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .pick-btn.ready.attacker-ready {
            background: linear-gradient(135deg, #0055aa, #003366);
            box-shadow: 0 4px 25px rgba(0, 150, 255, 0.25);
        }

        .pick-btn.ready.defender-ready {
            background: linear-gradient(135deg, #cc3300, #881100);
            box-shadow: 0 4px 25px rgba(255, 69, 0, 0.25);
        }

        .pick-btn.ready:hover {
            transform: translateY(-3px);
        }

        .pick-btn.ready.attacker-ready:hover {
            box-shadow: 0 8px 40px rgba(0, 150, 255, 0.35);
        }

        .pick-btn.ready.defender-ready:hover {
            box-shadow: 0 8px 40px rgba(255, 69, 0, 0.35);
        }

        .pick-btn:active {
            transform: scale(0.97) !important;
        }

        .pick-btn .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent);
            transition: left 0.6s ease;
        }

        .pick-btn.ready:hover .btn-shimmer {
            left: 100%;
        }

        /* 历史记录 */
        .history-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        .history-clear {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .history-clear:hover {
            color: rgba(255, 80, 80, 0.6);
            background: rgba(255, 80, 80, 0.1);
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 32px;
        }

        .history-item {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            animation: historyPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid transparent;
        }

        .history-item.attacker {
            background: rgba(0, 150, 255, 0.1);
            color: #66bfff;
            border-color: rgba(0, 150, 255, 0.2);
        }

        .history-item.defender {
            background: rgba(255, 69, 0, 0.1);
            color: #ff6a33;
            border-color: rgba(255, 69, 0, 0.2);
        }

        @keyframes historyPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 全部干员列表 (悬浮窗) */
        .operator-list-toggle {
            text-align: center;
            margin-top: 16px;
        }

        .operator-list-toggle button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .operator-list-toggle button:hover {
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.03);
        }

        /* 响应式 */
        @media (max-width: 540px) {
            .container {
                padding: 28px 20px 36px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .side-btn {
                font-size: 12px;
                padding: 12px 0;
            }

            .side-btn .btn-icon {
                font-size: 20px;
            }

            .operator-result {
                font-size: 24px;
            }

            .pick-btn {
                font-size: 15px;
                padding: 16px 0;
            }

            .display-area {
                padding: 22px 16px;
                min-height: 130px;
            }
        }

        /* 加载动画 - 粒子爆发 */
        .particle-burst {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particleFly 0.8s ease-out forwards;
        }

        .particle.attacker-particle {
            background: #0099ff;
            box-shadow: 0 0 6px #0099ff;
        }

        .particle.defender-particle {
            background: #ff4500;
            box-shadow: 0 0 6px #ff4500;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* 空状态 */
        .empty-hint {
            color: rgba(255, 255, 255, 0.08);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <div class="header">
            <span class="header-icon">⚔️</span>
            <h1>Rainbow Six</h1>
            <div class="subtitle">随机干员选择器</div>
        </div>

        <div class="side-selector">
            <button class="side-btn attacker" data-side="attacker" onclick="selectSide('attacker')">
                <span class="btn-icon">🔵</span>
                进攻方
            </button>
            <button class="side-btn defender" data-side="defender" onclick="selectSide('defender')">
                <span class="btn-icon">🔴</span>
                防守方
            </button>
        </div>

        <div class="display-area" id="displayArea">
            <div class="display-label" id="displayLabel">— 待选择 —</div>
            <div class="operator-result" id="operatorResult">
                <span class="empty-hint">??</span>
            </div>
            <div class="operator-count" id="operatorCount"></div>
        </div>

        <button class="pick-btn" id="pickBtn" onclick="pickOperator()">
            <span class="btn-shimmer"></span>
            <span id="pickBtnText">请选择阵营</span>
        </button>

        <div class="history-section">
            <div class="history-header">
                <span>📋 历史记录</span>
                <button class="history-clear" onclick="clearHistory()">清除</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="operator-list-toggle">
            <button onclick="toggleOperatorList()">📜 查看全部干员</button>
        </div>
    </div>

    <script>
        // ==================== 数据 ====================
        const ATTACKERS = [
            "Sledge","Thatcher","Ash","Thermite","Twitch","Montagne","Glaz","Fuze","Blitz","IQ","Buck",
            "Blackbeard","Capitao","Hibana","Jackal","Ying","Zofia","Dokkaebi","Lion","Finka","Maverick",
            "Nomad","Gridlock","Nøkk","Amaru","Kali","Iana","Ace","Zero","Flores","Osa","Sens","Brava","Ram",
            "Deimos","Rauora","Solid Snake"
        ];

        const DEFENDERS = [
            "Smoke","Mute","Castle","Pulse","Doc","Rook","Kapkan","Tachanka","Jager","Bandit","Frost",
            "Valkyrie","Caveira","Echo","Mira","Lesion","Ela","Vigil","Maestro","Alibi","Clash",
            "Kaid","Mozzie","Warden","Goyo","Wamai","Oryx","Melusi","Aruni","Thunderbird","Azami","Solis",
            "Fenrir","Thron","Tubarão","Skopós","Denari"
        ];

        // ==================== 状态 ====================
        let currentSide = null;       // 'attacker' | 'defender' | null
        let isPicking = false;
        let history = [];

        // DOM 引用
        const displayArea = document.getElementById('displayArea');
        const displayLabel = document.getElementById('displayLabel');
        const operatorResult = document.getElementById('operatorResult');
        const operatorCount = document.getElementById('operatorCount');
        const pickBtn = document.getElementById('pickBtn');
        const pickBtnText = document.getElementById('pickBtnText');
        const historyList = document.getElementById('historyList');

        const sideBtns = {
            attacker: document.querySelector('.side-btn.attacker'),
            defender: document.querySelector('.side-btn.defender'),
        };

        // ==================== 阵营选择 ====================
        function selectSide(side) {
            if (isPicking) return;

            currentSide = side;

            // 更新按钮状态
            Object.keys(sideBtns).forEach(key => {
                sideBtns[key].classList.toggle('active', key === side);
            });

            // 更新显示区域
            displayArea.className = 'display-area';
            displayArea.classList.add(side + '-active');

            const sideName = side === 'attacker' ? '进攻方' : '防守方';
            displayLabel.textContent = `🎯 ${sideName} · 就绪`;
            operatorResult.innerHTML = `<span style="opacity:0.3;font-size:18px;">点击下方按钮开始</span>`;

            const total = side === 'attacker' ? ATTACKERS.length : DEFENDERS.length;
            operatorCount.textContent = `共 ${total} 名干员`;

            // 更新按钮
            pickBtn.className = 'pick-btn ready';
            pickBtn.classList.add(side + '-ready');
            pickBtnText.textContent = side === 'attacker' ? '🎯 随机进攻干员' : '🎯 随机防守干员';
        }

        // ==================== 随机抽取 ====================
        function pickOperator() {
            if (isPicking || !currentSide) return;

            isPicking = true;
            pickBtn.className = 'pick-btn';
            pickBtnText.textContent = '🎰 抽选中...';

            const pool = currentSide === 'attacker' ? ATTACKERS : DEFENDERS;

            // 阶段1: 快速滚动 (约1.2秒)
            let spinCount = 0;
            const maxSpins = 15 + Math.floor(Math.random() * 8);
            const spinInterval = 60;

            operatorResult.className = 'operator-result spinning';

            const spinTimer = setInterval(() => {
                const randomOp = pool[Math.floor(Math.random() * pool.length)];
                operatorResult.textContent = randomOp;
                spinCount++;

                if (spinCount >= maxSpins) {
                    clearInterval(spinTimer);
                    // 阶段2: 最终揭示
                    finalReveal(pool);
                }
            }, spinInterval);
        }

        function finalReveal(pool) {
            const finalOp = pool[Math.floor(Math.random() * pool.length)];

            // 停止滚动动画
            operatorResult.className = 'operator-result';

            // 短暂延迟后揭示结果
            setTimeout(() => {
                operatorResult.textContent = finalOp;
                operatorResult.className = 'operator-result reveal';

                // 粒子爆发效果
                createParticleBurst();

                // 添加到历史
                addHistory(finalOp, currentSide);

                // 恢复按钮
                setTimeout(() => {
                    isPicking = false;
                    pickBtn.className = 'pick-btn ready';
                    pickBtn.classList.add(currentSide + '-ready');
                    pickBtnText.textContent = currentSide === 'attacker' ? '🎯 随机进攻干员' : '🎯 随机防守干员';
                }, 600);

            }, 100);
        }

        // ==================== 粒子爆发 ====================
        function createParticleBurst() {
            const rect = displayArea.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;
            const particleClass = currentSide === 'attacker' ? 'attacker-particle' : 'defender-particle';
            const count = 24;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = `particle ${particleClass}`;
                const angle = (i / count) * 360;
                const dist = 60 + Math.random() * 100;
                const tx = Math.cos(angle * Math.PI / 180) * dist;
                const ty = Math.sin(angle * Math.PI / 180) * dist;

                particle.style.cssText = `
                    left: ${cx}px;
                    top: ${cy}px;
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                    width: ${3 + Math.random() * 4}px;
                    height: ${3 + Math.random() * 4}px;
                    animation-delay: ${Math.random() * 0.1}s;
                `;
                displayArea.appendChild(particle);

                setTimeout(() => particle.remove(), 1000);
            }
        }

        // ==================== 历史记录 ====================
        function addHistory(op, side) {
            history.unshift({ operator: op, side: side, time: Date.now() });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<span class="empty-hint" style="font-size:12px;color:rgba(255,255,255,0.08);">暂无记录</span>';
                return;
            }

            historyList.innerHTML = history.map(item => {
                const sideCN = item.side === 'attacker' ? '🔵' : '🔴';
                return `<span class="history-item ${item.side}">${sideCN} ${item.operator}</span>`;
            }).join('');
        }

        // 初始化历史
        renderHistory();

        // ==================== 查看全部干员 ====================
        function toggleOperatorList() {
            const existing = document.querySelector('.operator-modal');
            if (existing) {
                existing.remove();
                return;
            }

            const modal = document.createElement('div');
            modal.className = 'operator-modal';
            modal.innerHTML = `
                <div class="modal-overlay" onclick="toggleOperatorList()"></div>
                <div class="modal-content">
                    <div class="modal-header">
                        <span>📜 全部干员</span>
                        <button onclick="toggleOperatorList()">✕</button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-section">
                            <h3>🔵 进攻方 <span>(${ATTACKERS.length})</span></h3>
                            <div class="modal-tags">
                                ${ATTACKERS.map(op => `<span class="tag tag-attacker">${op}</span>`).join('')}
                            </div>
                        </div>
                        <div class="modal-section">
                            <h3>🔴 防守方 <span>(${DEFENDERS.length})</span></h3>
                            <div class="modal-tags">
                                ${DEFENDERS.map(op => `<span class="tag tag-defender">${op}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            // 动画入场
            requestAnimationFrame(() => {
                modal.querySelector('.modal-content').classList.add('show');
                modal.querySelector('.modal-overlay').classList.add('show');
            });
        }

        // 模态框样式
        const modalStyle = document.createElement('style');
        modalStyle.textContent = `
            .operator-modal {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .modal-overlay {
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.6);
                opacity: 0;
                transition: opacity 0.3s ease;
                backdrop-filter: blur(4px);
            }

            .modal-overlay.show {
                opacity: 1;
            }

            .modal-content {
                position: relative;
                width: 520px;
                max-width: 90vw;
                max-height: 80vh;
                background: linear-gradient(160deg, #1a1a28, #0f0f18);
                border: 1px solid rgba(255,165,0,0.15);
                border-radius: 20px;
                padding: 28px;
                overflow-y: auto;
                transform: scale(0.9) translateY(20px);
                opacity: 0;
                transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
                box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            }

            .modal-content.show {
                transform: scale(1) translateY(0);
                opacity: 1;
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                padding-bottom: 14px;
                border-bottom: 1px solid rgba(255,255,255,0.06);
            }

            .modal-header span {
                font-family: 'Orbitron', sans-serif;
                font-size: 16px;
                font-weight: 700;
                color: rgba(255,255,255,0.7);
                letter-spacing: 2px;
            }

            .modal-header button {
                background: none;
                border: none;
                color: rgba(255,255,255,0.3);
                font-size: 18px;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 6px;
                transition: all 0.3s ease;
            }

            .modal-header button:hover {
                color: #fff;
                background: rgba(255,255,255,0.1);
            }

            .modal-body {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .modal-section h3 {
                font-family: 'Orbitron', sans-serif;
                font-size: 13px;
                letter-spacing: 2px;
                margin-bottom: 12px;
                color: rgba(255,255,255,0.5);
            }

            .modal-section h3 span {
                color: rgba(255,255,255,0.2);
                font-size: 12px;
            }

            .modal-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .tag {
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 700;
            }

            .tag-attacker {
                background: rgba(0,150,255,0.08);
                color: #66bfff;
                border: 1px solid rgba(0,150,255,0.12);
            }

            .tag-defender {
                background: rgba(255,69,0,0.08);
                color: #ff6a33;
                border: 1px solid rgba(255,69,0,0.12);
            }

            .modal-content::-webkit-scrollbar {
                width: 4px;
            }

            .modal-content::-webkit-scrollbar-track {
                background: transparent;
            }

            .modal-content::-webkit-scrollbar-thumb {
                background: rgba(255,165,0,0.2);
                border-radius: 4px;
            }

            @media (max-width: 540px) {
                .modal-content {
                    padding: 20px;
                    max-height: 70vh;
                }
                .tag {
                    font-size: 10px;
                    padding: 3px 8px;
                }
            }
        `;
        document.head.appendChild(modalStyle);
    </script>
</body>
</html>
